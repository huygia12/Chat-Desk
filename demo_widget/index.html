<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Store - ChatDesk Widget Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f7f7;
    }
    .header {
      background: #1890ff;
      color: #fff;
      padding: 24px 0;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      padding: 32px;
    }
    .product-list {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .product {
      background: #fafafa;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      padding: 24px;
      width: 220px;
      text-align: center;
    }
    .product img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 12px;
    }
    .product-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .product-price {
      color: #1890ff;
      font-size: 1.2rem;
      margin-bottom: 12px;
    }
    .buy-btn {
      background: #1890ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 8px 20px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .buy-btn:hover {
      background: #0050b3;
    }
  </style>
</head>
<body>
  <div class="header">Demo Store</div>
  <div class="container">
    <h2>Featured Products</h2>
    <div class="product-list">
      <div class="product">
        <img src="https://cdn-icons-png.flaticon.com/512/1041/1041916.png" alt="Phone">
        <div class="product-title">Smartphone X1</div>
        <div class="product-price">$499</div>
        <button class="buy-btn">Buy Now</button>
      </div>
      <div class="product">
        <img src="https://cdn-icons-png.flaticon.com/512/1041/1041914.png" alt="Laptop">
        <div class="product-title">Laptop Pro 15"</div>
        <div class="product-price">$1,299</div>
        <button class="buy-btn">Buy Now</button>
      </div>
      <div class="product">
        <img src="https://cdn-icons-png.flaticon.com/512/1041/1041915.png" alt="Headphones">
        <div class="product-title">Wireless Headphones</div>
        <div class="product-price">$199</div>
        <button class="buy-btn">Buy Now</button>
      </div>
    </div>
  </div>

  <!-- ChatDesk Widget Embed Example -->
  <!-- NOTE: Khi tạo widget, nhớ thêm origin của live server vào allowed_origins.
       Ví dụ: http://127.0.0.1:5500, http://127.0.0.1:5501, http://localhost:5500 ... -->
<script>
  window.ChatDeskWidget = {
    widgetId: 'greYvCZLWNJfWHsaYj5qrg',
    widgetSecret: 'YmlPsCmw7B1RoeKeMycJPhLlEkYA5CKgmvMYtA-HVdM',
    businessName: 'Customer support',
    apiUrl: 'http://localhost:8000',
  };
</script>
<script src="http://localhost:5173/embed.js"></script>
</body>
</html>
